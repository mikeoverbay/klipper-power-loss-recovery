# Mainsail button for power-loss / crash recovery (lost_z module).
# Mainsail shows each params.X below as an input box on the button.
# The step-by-step commands still exist for manual use from the console:
#   RECOVER_FROM_POWER_LOSS, MAKE_RESUME_FILE, START_RESUME_FILE
#
# BEFORE PRESSING - check the homing corner is clear:
#   1. Don't home after the crash. The head must still be where it stopped.
#   2. The button heats the nozzle in place, lifts it 5 mm, then homes X and Y.
#      X/Y homing ends at the front-left corner (X0 Y0), and Z is then homed
#      THERE: the whole gantry comes down to the bed at that corner.
#   3. So nothing may be under the nozzle at X0 Y0: no part, brim, purge line
#      blob, clip or tool. If a print ever reaches that corner, set park_x /
#      park_y in [lost_z] (printer.cfg) to a spot that's always clear.
#   4. This only works with a Z endstop at the bottom of travel that the gantry
#      triggers (a mechanical or optical switch). With a bed probe that
#      homes at the bed centre (safe_z_home) it would drive into the part.
#   5. The 5 mm lift happens before X/Y move, so the nozzle travels to the
#      corner above the top of the part. Keep hands and loose filament away
#      from the gantry while it runs.

[gcode_macro POWER_LOSS_RESUME]
description: After a power cut or crash. DON'T home first. CHECK the front-left corner (X0 Y0) is clear - Z homes there and the gantry comes down to the bed. Heats nozzle in place, lifts 5 mm, homes, measures where it stopped, finds the resume point, asks before printing.
gcode:
  {% set temp = params.TEMP|default(170)|float %}
  {% set mode = params.MODE|default("exact")|string|trim|lower %}
  RESUME_AFTER_POWER_LOSS TEMP={temp} MODE={mode}
